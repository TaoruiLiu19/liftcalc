[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "liftcalc"
version = "0.1.0"
description = "本地离线吊装计算后端（自用学习）"
requires-python = ">=3.12"
dependencies = [
  "pint>=0.24,<1",
  "numpy>=2.0,<3",
  "pydantic>=2.8,<3",
  "python-docx>=1.1,<2",
  "ezdxf>=1.3,<2",
  "typer>=0.12,<1",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest", "hypothesis", "sympy", "docxtpl"]

[project.scripts]
liftcalc = "liftcalc.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
liftcalc = ["data/schema.sql", "data/pack/*.csv", "data/pack/*.yaml", "data/pack/crane/*.csv"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py312"
# tools/ 是转录、PDF 提取、一次性迁移脚本，不参与代码规范
extend-exclude = ["tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "RUF", "UP"]
ignore = [
  "RUF001", "RUF002", "RUF003",  # 中文标点（，。：（））被当成歧义字符，本项目全中文，必然误报
  "B008",                          # typer.Option/Argument 必须写在默认值里
  "RUF046",                        # int() 包裹已是 int 的值，可读性偏好
]
