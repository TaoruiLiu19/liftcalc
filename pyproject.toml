[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "liftcalc"
version = "0.1.0"
description = "本地离线吊装计算后端（自用学习）"
requires-python = ">=3.12"
dependencies = [
  "pint>=0.24,<1",
  "numpy>=2.0,<3",
  "pydantic>=2.8,<3",
  "python-docx>=1.1,<2",
  "ezdxf>=1.3,<2",
  "typer>=0.12,<1",
  "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest", "hypothesis", "sympy", "docxtpl"]

[project.scripts]
liftcalc = "liftcalc.cli.main:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
liftcalc = ["data/schema.sql", "data/pack/*.csv", "data/pack/*.yaml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "RUF", "UP"]
